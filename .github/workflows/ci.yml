name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  # A run on request (gh workflow run ci.yml), for a push that changed only Markdown and so ran
  # docs.yml alone, such as the first push of a copy of this repository.
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so minutes are not spent on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same two commands a reader runs: node setup.mjs, then node check.mjs.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HELPDESK_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node setup.mjs
      - run: node check.mjs
