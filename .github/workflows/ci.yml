name: ci

# Every push to main and every pull request runs the full checks, except a change to Markdown and
# nothing else: that runs docs.yml, which checks the documents (chapters 6, 8 and 10) without
# installing anything (chapter 24). A change to code and documents together runs both.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  # A run on request (gh workflow run ci.yml), for a push that changed only Markdown and so ran
  # docs.yml alone, such as the first push of a copy of this repository.
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so minutes are not spent on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same two commands a reader runs: node setup.mjs, then node check.mjs, on the three systems
  # readers use (chapter 5's path limit is Windows-only), with the Python the lab is tested with,
  # and once more with the oldest Python the package declares (python/pyproject.toml's
  # requires-python), so that promise is tested too. Standard runners cost nothing on a public
  # repository; on a private one, Windows and macOS minutes cost more than Linux minutes.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    # GitHub cancels a job after 360 minutes unless told sooner. A run that hangs should cost
    # half an hour at most.
    timeout-minutes: 30
    env:
      HELPDESK_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node setup.mjs
      - run: node check.mjs

  # Chapter 16's side-by-side: the same layer rule in Go, Java (ArchUnit) and .NET (NetArchTest).
  # Nothing on a reader's machine runs these; this workflow does. Each also checks a planted
  # violation, so a rule that checks nothing fails.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: boundaries/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: boundaries/go/go.mod
          cache: false # the module has no dependencies to cache
      - run: go test ./...

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: boundaries/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - run: mvn -B test

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: boundaries/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run
