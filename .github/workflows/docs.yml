name: docs

# A change to Markdown runs the checks that read the documents: the instruction files' budget
# (chapter 6), what the documentation claims (chapter 8) and the work list and log (chapter 10).
# None of them needs Python or npm packages installed, so this takes seconds. ci.yml skips a change
# that touches nothing but Markdown; skipping these checks too would let a broken claim through
# unchecked, the gap chapter 8's field note ends on (chapter 24).
on:
  push:
    branches: [main]
    paths: ["**.md"]
  pull_request:
    paths: ["**.md"]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# The token each job gets reads the code and nothing more: no job here writes to the repository,
# and without this line it gets the repository's default, which can include write access. Each
# action is pinned to a full commit SHA, its version in the comment, because a tag can be moved
# to other code and a commit can't. `gh api repos/OWNER/REPO/commits/TAG` gives a new version's SHA.
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node tools/instruction-files.mjs . --max-tokens 4000
      - run: node tools/doc-claims.mjs .
      - run: node tools/progress.mjs .
