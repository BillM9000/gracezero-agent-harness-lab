# The models the platform knows, as components with a lifecycle (chapter 20). Every row is copied
# from the "Model status" table of Anthropic's "Model deprecations" page, with the replacements
# from the same page's deprecation history, as read on the date below. Copy what the page says;
# never estimate a date. Re-read the page before relying on this file: dates move, and new
# deprecations are announced there.
#
# state: "active", "legacy", "deprecated" or "retired", as the page defines them.
# retires: for a deprecated or retired model, its retirement date. For an active one, the page's
#   "not sooner than" date: the earliest it may retire, not a date it will. Left out where the page
#   says "to be announced".
# deprecated: the date the page gives for a deprecation.
# replacement: the model the page recommends instead, where it names one.
#
# python -m agent_policy reads this with agents/policy.toml (src/agent_policy/rules.py): a definition
# naming a model that has retired, is deprecated, or may retire within the policy's notice fails,
# with the date and what to move to. A test keeps every approved model here and active.
source = "https://platform.claude.com/docs/en/about-claude/model-deprecations"
read = 2026-09-24

