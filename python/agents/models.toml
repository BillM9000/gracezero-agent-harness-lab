# OpenAI's "Deprecations" page lists announcements, newest first, each with a shutdown date and a
# recommended replacement, and promises at least 6 months' notice for generally available models, 3
# for specialized variants and much less, such as 2 weeks, for preview models. Here, as read on the
# date below: the three models its models page features (GPT-6 Astra, "our flagship model for complex
# reasoning and coding"; GPT-6.1 Sol, "to balance intelligence and cost"; GPT-6 Luna, for
# cost-sensitive, high-volume work), the models the entries below name as replacements, each active
# with no retirement announced, and every chat or reasoning model the page deprecated from 2026-05-08
# on. Audio, image, video and endpoint deprecations, and older entries, are left out. The models page
# gives gpt-6.1-sol as its own default snapshot, so the id is pinned (chapter 20). A key with a dot
# is quoted, as TOML requires.
[openai]
name = "OpenAI"
page = "deprecations page"
source = "https://developers.openai.com/api/docs/deprecations"
read = 2026-10-01

[openai.models.gpt-6-astra]
state = "active"

[openai.models."gpt-6.1-sol"]
state = "active"

[openai.models.gpt-6-luna]
state = "active"

[openai.models."gpt-5.6-sol"]
state = "active"

[openai.models."gpt-5.6-terra"]
state = "active"

[openai.models."gpt-5.6-luna"]
state = "active"

# 2026-09-11: "will be removed from the API on October 1, 2026". The page names no model in its place,
# only "the most capable cyber model available to you", so no replacement is recorded.
[openai.models."gpt-5.4-cyber"]
state = "deprecated"
deprecated = 2026-09-11
retires = 2026-10-01

# 2026-06-11: "GPT-5 and o3 model deprecations", shut down December 11, 2026.
[openai.models.gpt-5-2025-08-07]
state = "deprecated"
deprecated = 2026-06-11
retires = 2026-12-11
replacement = "gpt-5.6-sol"

[openai.models.gpt-5-mini-2025-08-07]
