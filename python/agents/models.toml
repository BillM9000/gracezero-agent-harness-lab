# The models the platform knows, as components with a lifecycle (chapter 20), one section a
# provider. A section names the provider, the page its rows were copied from and the day they were
# read; python -m agent_policy reads every section (tracked, in src/agent_policy/rules.py) and names
# the provider and its page in what it reports. Copy what a page says; never estimate a date. Re-read
# a page before relying on its section: dates move, and new deprecations are announced there. The
# checks judge every date as of the latest read day below (tools/policy-date.mjs; AGENT_POLICY_TODAY
# sets another), the most recent day a provider's page was copied here.
#
# state: "active", "legacy", "deprecated" or "retired", as Anthropic's page defines them. For a page
#   that lists announcements instead of states, a model whose shutdown date is past the read day is
#   retired, one still to come is deprecated, and one in the catalog with no announcement is active.
# retires: for a deprecated or retired model, its retirement (shutdown) date. For an active one, the
#   earliest it may retire, where the page gives one (Anthropic's "not sooner than" dates): the
#   earliest it may retire, not a date it will. Left out where the page gives no date, or says "to
#   be announced".
# deprecated: the date the page gives for a deprecation; on a page of announcements, the announcement's.
# replacement: the model the page recommends instead, where it names one.
#
# python -m agent_policy reads this with agents/policy.toml (src/agent_policy/rules.py): a definition
# naming a model that has retired, is deprecated, or may retire within the policy's notice fails,
# with the date and what to move to. A test keeps every approved model here and active.

# Every row is copied from the "Model status" table of Anthropic's "Model deprecations" page, with
# the replacements from the same page's deprecation history, as read on the date below.
[anthropic]
name = "Anthropic"
page = "model deprecations page"
source = "https://platform.claude.com/docs/en/about-claude/model-deprecations"
read = 2026-09-24

