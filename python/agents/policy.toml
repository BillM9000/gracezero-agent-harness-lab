# The platform's rules for agent definitions (chapter 18), kept as data. python -m agent_policy
# checks every other file in this folder against it. Change a limit here; the rules that apply the
# limits are in src/agent_policy/rules.py, and tests/policy_fixtures/ shows what they accept and
# refuse.

# The most one model call may spend on output, in US dollars: max_tokens times the model's output
# price. At the prices below, that's 16,000 tokens from claude-opus-5-5 or 32,000 from
# claude-sonnet-5.
max_call_output_usd = 0.32

# The most turns an agent may allow one run. The loop stops at the agent's own limit (chapter 3);
# this caps what that limit may be.
max_turns = 10

# The tools an agent may be given. A test checks that they're exactly the tools the code provides
# (src/helpdesk/assistant/tools.py, delegate_customer in team.py, chapter 14, and the two in
# proposing.py, chapter 19).
tools = ["get_ticket", "find_tickets", "search_kb", "delegate_customer", "draft_reply", "close_ticket"]

# Whose approval a change can need, least first: "staff" is anyone who may change the ticket, and
# "lead" a lead (src/helpdesk/services/access.py, which a test keeps in step with this list).
approvers = ["staff", "lead"]

# Chapter 20: how many days before a model may retire an agent must move off it. The dates are in
# agents/models.toml, from Anthropic's model deprecations page, which promises at least 60 days'
# notice of a retirement; the lab adds 30 more, to test the replacement first.
retirement_notice_days = 90

# Chapter 19: the tools that change something, each with the least approval it needs. A definition
# that gives an agent one must name, under [approval], whose approval it needs, and no less than this.
# A test checks these are exactly the tools the code marks as writing.
[writes]
draft_reply = "staff"
close_ticket = "lead"

# The models an agent may use, with each one's output price per million tokens. A test checks the
# prices against src/helpdesk/model/cost.py, and another that each is in agents/models.toml and
# active.
[models]
claude-opus-5-5 = { output_usd_per_million = 20.0 }
claude-sonnet-5 = { output_usd_per_million = 10.0 }
