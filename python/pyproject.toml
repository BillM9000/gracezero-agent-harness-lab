[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk"
version = "0.1.0"
description = "A small helpdesk service, the companion lab for a book on AI platform engineering."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141", "uvicorn>=0.53", "anthropic>=1.8", "mcp>=2.2"]

# Exact versions this was last run against are in requirements-lock.txt.
[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.13", "import-linter>=2.15", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helpdesk = ["data/schema.sql", "data/kb/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test marked xfail that passes fails the run, so an expected failure can't hide a fixed bug, or
# stand as a done item's proof that passes by failing (chapter 10).
xfail_strict = true
# Any warning fails the run, except one known warning raised inside Starlette itself.
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Guardrails (chapter 16). Each contract has a short name and a broken_contract_guidance, which
# import-linter prints below the failure, so the output says how to fix what broke.
[tool.importlinter]
root_package = "helpdesk"
# The last contract names an installed package, anthropic, so the import graph must include them.
include_external_packages = true

# A layers contract only stops a lower layer importing a higher one. It does not stop a route
# importing the data layer directly (tests/guardrails caught that), so the next contract does.
[[tool.importlinter.contracts]]
name = "Layers: api and assistant, then services, then data"
type = "layers"
layers = ["helpdesk.api | helpdesk.assistant", "helpdesk.services", "helpdesk.data"]
broken_contract_guidance = "A lower layer must never import a higher one: the data layer must not know about services, routes or the assistant, and services must not know about routes or the assistant. api and assistant are siblings and must not import each other: put what both need in helpdesk.services."

[[tool.importlinter.contracts]]
name = "Routes and the assistant never import the data layer"
type = "forbidden"
source_modules = ["helpdesk.api", "helpdesk.assistant"]
forbidden_modules = ["helpdesk.data"]
allow_indirect_imports = true
broken_contract_guidance = "Code that needs data must call a service: move the query into helpdesk.services and call that from the route or the tool."

[[tool.importlinter.contracts]]
name = "helpdesk.model is a leaf"
type = "forbidden"
source_modules = ["helpdesk.model"]
forbidden_modules = ["helpdesk.api", "helpdesk.assistant", "helpdesk.services", "helpdesk.data"]
broken_contract_guidance = "helpdesk.model must not import helpdesk.api, helpdesk.assistant, helpdesk.services or helpdesk.data. Pass what the model needs in as arguments instead."

# An allow-list: it names who may import the SDK, so a module written later is covered without
# anyone adding it here.
[[tool.importlinter.contracts]]
name = "Only helpdesk.model imports the anthropic SDK"
type = "protected"
protected_modules = ["anthropic"]
allowed_importers = ["helpdesk.model"]
broken_contract_guidance = "Code outside helpdesk.model must not call the vendor directly. Take a ModelClient as an argument instead, so tests can pass the mock and refusals go through helpdesk.model.stops; if the model needs something new, add it to helpdesk.model."

# The MCP server (chapter 12) is a way in to the same tools, not a new home for rules: the protocol
# stays in one composition root, and everything it offers comes from the services and the toolbox.
[[tool.importlinter.contracts]]
name = "Only helpdesk.mcp_server imports the MCP SDK"
type = "protected"
protected_modules = ["mcp"]
allowed_importers = ["helpdesk.mcp_server"]
broken_contract_guidance = "Only helpdesk/mcp_server.py may use the MCP SDK. Put the rule in helpdesk.services or the toolbox, where every way in applies it, and have the server call that."

# Chapter 20: nothing the assistant can reach sends anything outside. The fitness test
# (tests/fitness/test_nothing_sends_outside.py) reads these packages' own imports; this follows the
# lab's imports from them, so a service that imports a module which reaches the network breaks it
# too. The forbidden modules are the fitness test's OUTSIDE, which that test keeps equal; one that no
# module imports isn't in the graph, and is checked once something imports it.
[[tool.importlinter.contracts]]
name = "Nothing the assistant can reach imports a way out"
type = "forbidden"
source_modules = ["helpdesk.assistant", "helpdesk.services", "helpdesk.data"]
forbidden_modules = [
    "aiohttp", "anthropic", "asyncio", "ctypes", "ftplib", "http", "httpcore", "httpcore2", "httpx",
    "httpx2", "imaplib", "mcp", "multiprocessing", "poplib", "requests", "smtplib", "socket", "ssl",
    "subprocess", "telnetlib", "urllib", "urllib3", "webbrowser", "websockets", "xmlrpc",
]
broken_contract_guidance = "The assistant's tools and the code they call must not reach another machine or start a program, directly or through another module: an injected ticket could make the model use it (chapter 20). Put the call behind a composition root, such as helpdesk.mcp_server, and give the assistant a tool that files a proposal for a person instead."

# Chapter 19: an agent proposes, a person decides. The code that approves or rejects a proposal is
# reachable only from the command a person runs, so no tool, agent loop, MCP server or route can call
# it, whatever a model asks for.
[[tool.importlinter.contracts]]
name = "Only helpdesk.approvals decides a proposal"
type = "protected"
protected_modules = ["helpdesk.services.decisions"]
allowed_importers = ["helpdesk.approvals"]
broken_contract_guidance = "Only python -m helpdesk.approvals, where a person decides, may import helpdesk.services.decisions. An agent's tool files a proposal with helpdesk.services.proposals instead. A route that decides needs a sign-in that proves who is asking first, which this API doesn't have."
