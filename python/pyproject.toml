[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk"
version = "0.1.0"
description = "A small helpdesk service, the companion lab for a book on AI platform engineering."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141", "uvicorn>=0.53"]

# Exact versions this was last run against are in requirements-lock.txt.
[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.13", "import-linter>=2.15", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helpdesk = ["data/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Any warning fails the run, except one known warning raised inside Starlette itself.
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Guardrails. Each contract's name is printed when it fails, so the name carries the fix.
[tool.importlinter]
root_package = "helpdesk"

# A layers contract only stops a lower layer importing a higher one. It does not stop a route
# importing the data layer directly (tests/guardrails caught that), so the next contract does.
[[tool.importlinter.contracts]]
name = "Layers run api, then services, then data. A lower layer must never import a higher one: the data layer must not know about services or routes, and services must not know about routes."
type = "layers"
layers = ["helpdesk.api", "helpdesk.services", "helpdesk.data"]

[[tool.importlinter.contracts]]
name = "Routes must not import the data layer directly. A route that needs data must call a service: move the query into helpdesk.services and call that from the route."
type = "forbidden"
source_modules = ["helpdesk.api"]
forbidden_modules = ["helpdesk.data"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "helpdesk.model is a leaf and must not import helpdesk.api, helpdesk.services or helpdesk.data. Pass what the model needs in as arguments instead."
type = "forbidden"
source_modules = ["helpdesk.model"]
forbidden_modules = ["helpdesk.api", "helpdesk.services", "helpdesk.data"]
