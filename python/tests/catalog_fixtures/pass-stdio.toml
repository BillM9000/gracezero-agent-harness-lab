# expect: pass
# A stdio server: an exact command, no address and no scopes. It takes its credentials from
# its environment.
[[servers]]
name = "notes"
owner = "docs-team"
transport = "stdio"
command = ["uvx", "example-notes-mcp==0.3.1"]
tools = ["search_notes", "read_note"]
approved = "2026-09-20"
approved_by = "platform-security"
