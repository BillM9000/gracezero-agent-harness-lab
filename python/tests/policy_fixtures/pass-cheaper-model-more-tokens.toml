# expect: pass
# 32,000 tokens from claude-sonnet-5 could cost $0.32 a call, which is within the cap.
# The same number from claude-opus-5-5 isn't: see fail-too-many-tokens-for-the-model.
name = "triage"
owner = "support-tools"
model = "claude-sonnet-5"
max_tokens = 32000
max_turns = 6
tools = ["get_ticket", "search_kb"]
system = "Triage helpdesk tickets and draft replies for staff to review."
