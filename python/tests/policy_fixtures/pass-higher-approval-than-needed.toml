# expect: pass
# Chapter 19: the policy sets the least approval a tool needs. A team may ask for more: here every
# reply waits for a lead.
name = "triage"
owner = "support-tools"
model = "claude-opus-5-5"
max_tokens = 16000
max_turns = 6
tools = ["get_ticket", "draft_reply"]
system = "Triage helpdesk tickets and draft replies for staff to review."

[approval]
draft_reply = "lead"
