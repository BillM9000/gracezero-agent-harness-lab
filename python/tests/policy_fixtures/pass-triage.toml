# expect: pass
# The triage assistant's real settings: two tools that change things, each with the approval it needs.
name = "triage"
owner = "support-tools"
model = "claude-opus-5-5"
max_tokens = 16000
max_turns = 6
tools = ["get_ticket", "find_tickets", "search_kb", "draft_reply", "close_ticket"]
system = "Triage helpdesk tickets and draft replies for staff to review."

[approval]
draft_reply = "staff"
close_ticket = "lead"
