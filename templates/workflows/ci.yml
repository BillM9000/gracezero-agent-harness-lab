name: ci

# The full checks on every push to main and every pull request, except a change to Markdown and
# nothing else, which docs.yml checks instead (chapter 24). This is the lab's own
# .github/workflows/ci.yml, trimmed; tools/templates.test.mjs fails if they drift apart.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read access to the code and nothing more; each action pinned to a commit, not a tag that can move.
# TEMPLATE: widen permissions only for a job that writes, and only as far as it needs.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # TEMPLATE: the systems your readers or users run on, and the Python you test with...
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
        # TEMPLATE: ...and once with the oldest Python your package declares it supports.
        include:
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    # GitHub's default is 360 minutes. A run that hangs should cost half an hour at most.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TEMPLATE: the toolchains your checks need, at the versions you test with.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # TEMPLATE: the same two commands a person runs, so CI and a laptop can't disagree.
      - run: node setup.mjs
      - run: node check.mjs
