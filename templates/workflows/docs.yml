name: docs

# A change to Markdown alone runs the checks that read documents, and nothing that needs installing
# (chapter 24). Skipping these too would let a broken claim through. This is the lab's own
# .github/workflows/docs.yml, trimmed; tools/templates.test.mjs fails if they drift apart.
on:
  push:
    branches: [main]
    paths: ["**.md"]
  pull_request:
    paths: ["**.md"]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Read access to the code and nothing more; each action pinned to a commit, not a tag that can move.
# TEMPLATE: widen permissions only for a job that writes, and only as far as it needs.
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # TEMPLATE: every check that reads your documents: the instruction files' budget, what the
      # documentation claims, and the work list.
      - run: node tools/instruction-files.mjs . --max-tokens 4000
      - run: node tools/doc-claims.mjs .
      - run: node tools/progress.mjs .
