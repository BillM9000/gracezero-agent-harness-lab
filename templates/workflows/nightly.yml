name: nightly

# Breaks every guard in tools/mutations.mjs, one at a time, and requires a test to catch each
# (chapter 24). It takes minutes, so it runs once a day and on request. This is the lab's own
# .github/workflows/nightly.yml, trimmed; tools/templates.test.mjs fails if they drift apart.
on:
  schedule:
    # Off the hour: scheduled runs can be delayed, and some dropped, at busy times.
    - cron: "17 4 * * *"
  workflow_dispatch:

# Read access to the code and nothing more; each action pinned to a commit, not a tag that can move.
# TEMPLATE: widen permissions only for a job that writes, and only as far as it needs.
permissions:
  contents: read

jobs:
  mutations:
    runs-on: ubuntu-latest
    # TEMPLATE: room for the whole list, which only grows.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node setup.mjs
      - run: node tools/mutate.mjs
